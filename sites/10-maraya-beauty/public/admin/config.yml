              name: item
              label: بريد صاحب المتجر
              widget: string
            required: false
          - name: ownerWhatsapp
            label: واتساب صاحب المتجر
            widget: string
            required: false
            pattern:
              - ^\+[1-9][0-9]{7,14}$
