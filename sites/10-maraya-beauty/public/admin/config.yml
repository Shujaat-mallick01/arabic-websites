                label: الحد اليومي
                widget: number
                value_type: int
                min: 0
                required: false
          - name: deposit
            label: العربون
            widget: object
            required: false
            fields:
              - name: kind
                label: النوع
                widget: select
                options:
                  - value: none
                    label: بدون عربون
                  - value: fixed
                    label: مبلغ ثابت
                  - value: percent
                    label: نسبة من السعر
                default: none
                required: false
              - name: amount
                label: المبلغ الثابت
                widget: number
                value_type: float/string
                step: 0.01
