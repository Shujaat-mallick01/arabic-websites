ar:
  question: أقدر أختار الخبيرة والغرفة؟
  answer: تقدري تختاري الخبيرة من صفحة الحجز، أو نخلي النظام يختار أول وحدة فاضية. الغرفة الخاصة متاحة للمكياج والشعر والرموش.
  featured: true
  order: 3
en:
  question: Can I choose my stylist and room?
  answer: You can pick your stylist when booking, or let us assign the first free one. The private room is available for makeup, hair and lashes.
