ar:
  question: فاتحين لحد متى؟ وأقدر أحجز بعد نص الليل؟
  answer: كل يوم لحد الساعة ٢ بالليل. بعد نص الليل نسوّي الأظافر والرموش والسشوار.
  featured: true
  order: 5
en:
  question: How late are you open? Can I book after midnight?
  answer: Every day until 2 am. After midnight we offer nails, lashes and blow-dry.
