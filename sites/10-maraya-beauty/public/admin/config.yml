                widget: datetime
                type: date
                format: YYYY-MM-DD
              - name: to
                label: إلى
                widget: datetime
                type: date
                format: YYYY-MM-DD
              - name: reason
                label: السبب
                widget: object
                fields:
                  - name: ar
                    label: بالعربي
                    widget: string
                    required: false
                  - name: en
                    label: بالإنجليزي
                    widget: string
                    required: false
