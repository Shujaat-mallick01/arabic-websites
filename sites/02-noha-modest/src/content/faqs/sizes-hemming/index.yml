ar:
  question: كيف أختار مقاس الروب، وكم مقاس الشيلة؟
  answer: جدول مقاسات الأرواب بالسنتيمتر في صفحة دليل المقاسات، والقصّة واسعة. الشيلات والطرح مقاس واحد، حوالي 180 × 70 سم.
  topic: sizes
  featured: true
  order: 3
en:
  question: How do I choose a robe size, and how big are the shaylas?
  answer: The robe size chart in centimetres is on the size guide page; the cut is relaxed. Shaylas and scarves are one size, about 180 × 70 cm.
