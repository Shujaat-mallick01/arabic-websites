ar:
  question: تسوّوا مكياج العروس في القاعة أو البيت؟
  answer: إيوه لباقتي الجَلوة والغُمرة، بطلب على الواتساب ورسوم مشوار حسب الحي.
  featured: true
  order: 4
en:
  question: Do you do bridal makeup at the hall or at home?
  answer: Yes, for the Jalwa and Ghumra packages, by WhatsApp request with a travel fee by district.
