# GENERATED by pnpm site:sync from @aw/content field definitions. Do not edit.
backend:
  name: github
  repo: your-github-user/arabic-websites
  branch: main
  skip_ci: true
site_url: https://dareesha-demo.netlify.app
display_url: https://dareesha-demo.netlify.app
logo_url: /favicon.svg
app_title: دريشة · إدارة المحتوى
media_folder: sites/02-noha-modest/src/content/_uploads
public_folder: /_uploads
media_libraries:
  all:
    max_file_size: 8000000
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2048
        height: 2048
      heic:
        format: webp
        quality: 82
        width: 1600
        height: 1600
      svg:
        optimize: true
i18n:
  structure: single_file
  locales:
    - ar
    - en
  default_locale: ar
collections:
  - name: products
    label: المنتجات
    label_singular: منتج
    folder: sites/02-noha-modest/src/content/products
    path: "{{slug}}/index"
    extension: yml
    format: yaml
    create: true
    slug: "{{fields._slug}}"
    media_folder: ""
    public_folder: ""
    i18n: true
    summary: "{{title}} — {{price}}"
    sortable_fields:
      - title
      - price
      - order
    fields:
      - name: id
        widget: hidden
        default: "{{uuid_short}}"
        i18n: false
      - name: _slug
        label: رابط الصفحة (بالإنجليزي)
        hint: حروف إنجليزية صغيرة وأرقام وشرطات فقط، مثل linen-kaftan. لا يُغيَّر بعد النشر لأنه جزء من الرابط.
        i18n: false
        widget: string
        required: false
        pattern:
          - ^[a-z0-9]+(-[a-z0-9]+)*$
          - يُسمح بالحروف الإنجليزية الصغيرة والأرقام والشرطة فقط
      - name: title
        label: الاسم
        i18n: true
