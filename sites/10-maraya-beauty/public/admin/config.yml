          - name: notifyOn
            label: التنبيه عند
            widget: select
            options:
              - value: order.placed
                label: طلب جديد
              - value: order.paid
                label: طلب مدفوع
              - value: booking.confirmed
                label: حجز مؤكد
              - value: enquiry
                label: استفسار
            multiple: true
            required: false
