ar:
  question: كيف أختار مقاسي، وتقصّرون العباية على طولي؟
  answer: جدول المقاسات بالسنتيمتر في صفحة دليل المقاسات. العبايات المفتوحة نقصّرها مجاناً على الطول اللي تختارينه (من 52 إلى 60 بوصة)، والتقصير يضيف يومين على التجهيز.
  topic: sizes
  featured: true
  order: 3
en:
  question: How do I choose my size, and can you hem the abaya to my length?
  answer: The size chart in centimetres is on the size guide page. We hem open abayas to your chosen length (52–60 in) for free; hemming adds two days to preparation.
