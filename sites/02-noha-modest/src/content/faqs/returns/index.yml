ar:
  question: أقدر أبدّل أو أرجّع القطعة؟
  answer: إيه، خلال ١٤ يوماً من الاستلام إذا كانت القطعة ما انلبست وفيها البطاقة. القطع المقصّرة والشيلات ما تُسترجع. التفاصيل في سياسة الاستبدال والاسترجاع.
  topic: returns
  featured: false
  order: 4
en:
  question: Can I exchange or return a piece?
  answer: Yes, within 14 days of delivery if the piece is unworn with its tags. Hemmed pieces and shaylas are final sale. Details are in the returns policy.
