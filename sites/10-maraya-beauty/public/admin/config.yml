    extension: yml
    format: yaml
    create: true
    slug: "{{fields._slug}}"
    media_folder: ""
    public_folder: ""
    i18n: true
    summary: "{{title}} — {{durationMinutes}} دقيقة"
    sortable_fields:
      - title
      - price
      - order
    fields:
      - name: id
        widget: hidden
        default: "{{uuid_short}}"
        i18n: false
      - name: _slug
        label: رابط الصفحة (بالإنجليزي)
        hint: حروف إنجليزية صغيرة وأرقام وشرطات فقط، مثل linen-kaftan. لا يُغيَّر بعد النشر لأنه جزء من الرابط.
        i18n: false
        widget: string
        required: false
        pattern:
          - ^[a-z0-9]+(-[a-z0-9]+)*$
