                widget: text
                required: false
              - name: en
                label: بالإنجليزي
                widget: text
                required: false
          - name: shareImage
            label: صورة المشاركة
            widget: image
            choose_url: false
            required: false
      - name: booking
        label: الحجوزات
        file: sites/10-maraya-beauty/src/content/settings/booking.json
        format: json
        media_folder: media
        public_folder: ./media
        fields:
          - name: slotStepMinutes
            label: فاصل المواعيد (دقائق)
            widget: select
            options:
              - value: "5"
                label: "5"
              - value: "10"
                label: "10"
              - value: "15"
                label: "15"
              - value: "30"
                label: "30"
              - value: "60"
                label: "60"
            default: "30"
            required: false
          - name: leadMinutes
            label: أقل مدة قبل الموعد (دقائق)
            widget: number
            value_type: int
            min: 0
            default: 180
            required: false
          - name: sameDayCutoff
            label: آخر وقت لحجز نفس اليوم
            widget: datetime
            type: time
            format: HH:mm
            required: false
          - name: horizonDays
            label: يُفتح الحجز لمدة (أيام)
            widget: number
            value_type: int
            min: 1
            default: 45
            required: false
          - name: bufferBefore
            label: وقت تجهيز قبل الموعد (دقائق)
            widget: number
            value_type: int
            min: 0
            default: 0
            required: false
          - name: bufferAfter
            label: وقت بعد الموعد (دقائق)
            widget: number
            value_type: int
            min: 0
            default: 10
            required: false
          - name: dailyCap
            label: الحد اليومي
            widget: object
            collapsed: true
            required: false
            fields:
              - name: default
                label: الحد اليومي
                widget: number
                value_type: int
                min: 0
                required: false
              - name: sat
                label: حد السبت
                widget: number
                value_type: int
                min: 0
                required: false
              - name: sun
                label: حد الأحد
                widget: number
                value_type: int
                min: 0
                required: false
              - name: mon
                label: حد الاثنين
                widget: number
                value_type: int
                min: 0
                required: false
              - name: tue
                label: حد الثلاثاء
                widget: number
                value_type: int
                min: 0
                required: false
              - name: wed
                label: حد الأربعاء
                widget: number
                value_type: int
                min: 0
                required: false
              - name: thu
                label: حد الخميس
                widget: number
                value_type: int
                min: 0
                required: false
              - name: fri
                label: حد الجمعة
                widget: number
                value_type: int
                min: 0
                required: false
              - name: unit
                label: يُحسب بعدد
                widget: select
                options:
                  - value: bookings
                    label: الحجوزات
                  - value: orders
                    label: الطلبات
                  - value: guests
                    label: الأشخاص
                default: bookings
                required: false
          - name: blackouts
            label: أيام مغلقة
            widget: list
            summary: "{{fields.from}} → {{fields.to}}"
