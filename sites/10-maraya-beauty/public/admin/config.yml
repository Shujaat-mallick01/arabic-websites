        file: sites/10-maraya-beauty/src/content/settings/notifications.json
        format: json
        media_folder: media
        public_folder: ./media
        fields:
          - name: ownerEmails
            label: بريد صاحب المتجر
            hint: تصل عليه تنبيهات الطلبات ويُستخدم لدخول لوحة الطلبات.
            widget: list
