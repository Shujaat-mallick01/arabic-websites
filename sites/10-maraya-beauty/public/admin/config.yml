      - name: category
        label: القسم
        i18n: false
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields:
          - title
        display_fields:
          - title
      - name: durationMinutes
        label: المدة (دقائق)
        i18n: false
        widget: number
        value_type: int
        min: 5
      - name: priceKind
        label: نوع السعر
        i18n: false
        widget: select
        options:
          - value: fixed
            label: سعر ثابت
          - value: from
            label: يبدأ من
        default: fixed
        required: false
      - name: price
        label: السعر
        i18n: false
        widget: number
        value_type: float/string
        step: 0.01
        min: 0
        after_input: ر.س
        hint: بالعملة المحلية، مثل 125.00.
      - name: deposit
        label: عربون خاص بالخدمة
