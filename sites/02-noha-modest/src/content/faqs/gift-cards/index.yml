ar:
  question: كيف تشتغل بطاقة الهدية؟
  answer: تختارين المبلغ وتدفعين أونلاين، وتوصلج صفحة فيها رمز البطاقة ترسلينه واتساب أو إيميل. الرصيد يُستخدم على أكثر من طلب لمدة ١٢ شهراً.
