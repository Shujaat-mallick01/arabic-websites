# GENERATED by pnpm site:sync from @aw/content field definitions. Do not edit.
backend:
  name: github
  repo: your-github-user/arabic-websites
  branch: main
  skip_ci: true
site_url: https://jalwa-lounge-demo.netlify.app
display_url: https://jalwa-lounge-demo.netlify.app
logo_url: /favicon.svg
app_title: جَلوة · إدارة المحتوى
media_folder: sites/10-maraya-beauty/src/content/_uploads
public_folder: /_uploads
media_libraries:
  all:
    max_file_size: 8000000
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2048
        height: 2048
      heic:
        format: webp
        quality: 82
        width: 1600
        height: 1600
      svg:
        optimize: true
i18n:
  structure: single_file
  locales:
    - ar
    - en
  default_locale: ar
collections:
  - name: services
    label: الخدمات
    label_singular: خدمة
    folder: sites/10-maraya-beauty/src/content/services
