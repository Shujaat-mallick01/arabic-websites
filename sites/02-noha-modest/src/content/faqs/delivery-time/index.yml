ar:
  question: كم يوم يحتاج طلبي عشان يوصل لدولتي؟
  answer: داخل البحرين يوصلج خلال يوم عمل. السعودية والكويت وقطر خلال ٢ إلى ٤ أيام عمل تقريباً، والإمارات وعُمان خلال ٢ إلى ٥ أيام. في كل صفحة منتج تشوفين تاريخ الوصول المتوقع لدولتج.
  topic: delivery
  featured: true
  order: 1
en:
  question: How long does my order take to reach my country?
  answer: Within Bahrain it arrives in one working day. Saudi Arabia, Kuwait and Qatar take about 2–4 working days, and the UAE and Oman 2–5. Every product page shows the expected arrival date for your country.
